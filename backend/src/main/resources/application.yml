server:
  port: ${PORT:8080}
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/jetsetgo}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-replace-this-before-deploying-jetsetgo-2026}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
